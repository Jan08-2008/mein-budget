<style>
/* Layout: Seitenleiste links (PC) · Inhalt rechts · Handy: Leiste unten */
:root{
  --bg:#f4f6fb;--card:#ffffff;--text:#0b1324;--muted:#667085;--border:#e6eaf2;
  --primary:#2563eb;--primary-2:#1d4ed8;--primary-weak:#eaf1ff;--on-primary:#fff;
  --green:#15803d;--orange:#c2410c;--red:#dc2626;--teal:#14b8a6;
  --green-bg:#e3f6ea;--orange-bg:#fff1e6;--red-bg:#fdeaea;
  --hero-1:#0b1f4b;--hero-2:#123a8a;--hero-text:#eaf0ff;--hero-muted:#a9b8e0;--hero-line:#5eead4;
  --side:#ffffff;--track:#edf1f7;--shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05);
  --radius:20px;--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a0f1c;--card:#121a2b;--text:#e7ecf7;--muted:#8d9ab5;--border:#1f2a40;
  --primary:#6b9bff;--primary-2:#4f83ff;--primary-weak:#17244a;--on-primary:#06122e;
  --green:#4ade80;--orange:#fb923c;--red:#f87171;
  --green-bg:#10301f;--orange-bg:#3a230f;--red-bg:#3b1616;
  --hero-1:#0b1736;--hero-2:#173a85;--side:#0e1525;
  --track:#1f2a40;--shadow:none;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0f1c;--card:#121a2b;--text:#e7ecf7;--muted:#8d9ab5;--border:#1f2a40;
  --primary:#6b9bff;--primary-2:#4f83ff;--primary-weak:#17244a;--on-primary:#06122e;
  --green:#4ade80;--orange:#fb923c;--red:#f87171;
  --green-bg:#10301f;--orange-bg:#3a230f;--red-bg:#3b1616;
  --hero-1:#0b1736;--hero-2:#173a85;--side:#0e1525;
  --track:#1f2a40;--shadow:none;color-scheme:dark;
}
/* Akzentfarben (Einstellungen → Darstellung) */
:root[data-accent="violet"]{--primary:#7c3aed;--primary-2:#6d28d9;--primary-weak:#f1eaff;--hero-1:#24104f;--hero-2:#4c1d95}
:root[data-accent="gruen"]{--primary:#059669;--primary-2:#047857;--primary-weak:#e3f7ef;--hero-1:#062c22;--hero-2:#065f46}
:root[data-accent="orange"]{--primary:#ea580c;--primary-2:#c2410c;--primary-weak:#fff0e6;--hero-1:#3b1405;--hero-2:#9a3412}
:root[data-accent="pink"]{--primary:#db2777;--primary-2:#be185d;--primary-weak:#fde9f2;--hero-1:#3d0a24;--hero-2:#9d174d}
:root[data-accent="grau"]{--primary:#334155;--primary-2:#1e293b;--primary-weak:#eef1f5;--hero-1:#0f172a;--hero-2:#334155}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--green)}.sync.saving i{background:var(--orange)}.sync.err i{background:var(--red)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:10px;height:60px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo b{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--primary);color:var(--on-primary);font-size:16px}
.month{display:flex;align-items:center;gap:2px;margin-left:auto;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:2px}
.month span{min-width:118px;text-align:center;font-weight:600;font-size:14px}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:999px;cursor:pointer;display:grid;place-items:center;font-size:16px}
.icon-btn:hover{background:var(--primary-weak)}
.btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.danger{color:var(--red)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
nav.tabs{display:flex;gap:4px;padding:10px 0 0}
nav.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
nav.tabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
main{padding:18px 0 30px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:16px;margin:0 0 12px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-weight:500;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.hero{padding:24px}
.hero .lbl{color:var(--muted);font-weight:600}
.hero .big{font-size:clamp(36px,8vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--orange)}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.chart-box{position:relative;height:270px}
.list{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--border)}
.tx:first-child{border-top:0}
.tx .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--bg)}
.tx .d{min-width:0}
.tx .d .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .d .s{font-size:12.5px;color:var(--muted)}
.tx .a{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.txfull{grid-template-columns:38px 1fr 150px 100px 30px}
select.cat{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:5px 6px;font-size:13px;width:100%;cursor:pointer}
input.inp,select.inp{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
input.inp:focus,select.inp:focus,select.cat:focus{outline:2px solid var(--primary);outline-offset:-1px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .inp{width:auto;flex:1 1 160px}
.pill{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.orange{background:var(--orange-bg);color:var(--orange)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.none{background:var(--bg);color:var(--muted)}
.bud{padding:12px 0;border-top:1px solid var(--border)}
.bud:first-of-type{border-top:0}
.bud-h{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-weight:600}
.bud-h .pill{margin-left:auto}
.bud-f{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13px;color:var(--muted)}
.bud-f input{width:96px;margin-left:auto;padding:5px 8px;border-radius:8px}
.row-ed{display:grid;grid-template-columns:1fr 120px 34px;gap:8px;margin-bottom:8px}
.sum-line{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.sum-line.tot{border-top:2px solid var(--border);margin-top:6px;padding-top:10px;font-weight:800;font-size:17px}
.goal{padding:16px 0;border-top:1px solid var(--border)}
.goal:first-child{border-top:0;padding-top:0}
.goal-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.goal-h b{font-size:17px}
.goal-h .r{margin-left:auto;font-variant-numeric:tabular-nums}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.note.red{background:var(--red-bg)}
.note.orange{background:var(--orange-bg)}
.note.green{background:var(--green-bg)}
.note.blue{background:var(--primary-weak)}
.goal-act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.goal-act input{width:110px;padding:5px 8px;border-radius:8px}
.tip{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.tip:first-child{border-top:0;padding-top:0}
.tip .ic{font-size:22px;line-height:1}
.tip p{margin:2px 0 0}
.empty{text-align:center;padding:40px 20px}
.empty .e{font-size:44px}
.drop{border:2px dashed var(--border);border-radius:var(--radius);padding:28px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover{border-color:var(--primary);background:var(--primary-weak)}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);width:min(920px,100%);max-height:90vh;display:flex;flex-direction:column}
.modal.sm{width:min(460px,100%)}
.modal-h{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);gap:10px}
.modal-h h3{margin:0;font-size:17px}
.modal-h .icon-btn{margin-left:auto}
.modal-b{padding:16px 18px;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
table.pv{width:100%;border-collapse:collapse;font-size:13.5px}
table.pv th{text-align:left;color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid var(--border);position:sticky;top:-16px;background:var(--card)}
table.pv td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
table.pv tr.dup td{opacity:.5}
table.pv input[type=number]{width:96px;padding:4px 6px;border-radius:7px;border:1px solid var(--border);background:var(--bg);text-align:right}
table.pv .desc{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.dragover::after{content:"Kontoauszug hier ablegen";position:fixed;inset:12px;border:3px dashed var(--primary);border-radius:20px;background:color-mix(in srgb,var(--primary) 12%,transparent);display:grid;place-items:center;font-size:22px;font-weight:800;color:var(--primary);z-index:70}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:14px}
.kv:first-child{border-top:0}
.hide-m{}
.dash-top{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.dash-top>.hero{align-self:start}
.acc-row{display:grid;grid-template-columns:minmax(0,1fr) 100px 120px 34px;gap:6px;align-items:center}
@media (max-width:520px){.acc-row{grid-template-columns:minmax(0,1fr) 90px 34px}.acc-row select{grid-column:1/3}}
.goal.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,30%{background:var(--primary-weak);box-shadow:0 0 0 8px var(--primary-weak)}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion:reduce){.goal.flash{animation:none;background:var(--primary-weak)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
.yt td,.yt th{white-space:nowrap;font-variant-numeric:tabular-nums}
.yt tr.sumrow td{border-top:2px solid var(--text);font-weight:700}
.acc-line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.acc-line:first-of-type{border-top:0}
.scope-choice{display:grid;gap:6px;margin-top:-4px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:13.5px}
.scope-choice label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.split-box{display:grid;gap:8px;padding:10px 12px;border:1px dashed var(--border);border-radius:12px}
.te-split{display:grid;grid-template-columns:minmax(0,1fr) 100px 34px;gap:6px;align-items:center}
.bal-up{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:12px}
.bal-up .inp{width:130px;padding:6px 8px}
.sug-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--border);font-size:14px;cursor:pointer}
.sug-row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:24px;align-items:center}
.calc{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:6px 14px}
.calc .kv,.pact-mini .kv{font-variant-numeric:tabular-nums}
.kv b{white-space:nowrap}
.kv.tot{border-top:2px solid var(--text);font-weight:800}
.pact-mini.red{border-color:var(--red)}.pact-mini.orange{border-color:var(--orange)}
.pact.red{border:2px solid var(--red)}.pact.orange{border:2px solid var(--orange)}
.pm-num b{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pm-num span{color:var(--muted);font-weight:600}
.pact-mini a.small{display:inline-block;margin-top:8px}
.ampel{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.amp-h{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px;font-variant-numeric:tabular-nums}
.day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:12px 0 4px;border-bottom:1px solid var(--border)}
.day-h:first-child{padding-top:0}
.day-h+.tx{border-top:0}
.row-ed2{display:grid;grid-template-columns:minmax(0,1fr) 100px 86px 150px 34px;gap:8px;margin-bottom:8px;align-items:center}
.row-ed2 select.inp{padding:8px 6px}
.cal{display:flex;flex-direction:column}
.cal-row{display:grid;grid-template-columns:78px minmax(0,1fr) 70px auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-size:14px}
.cal-row:first-child{border-top:0}
.cal-row.done .cal-n,.cal-row.done .cal-d{color:var(--muted)}
.cal-d{font-weight:600;font-variant-numeric:tabular-nums}
.cal-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-a{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pact-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pk{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.pk.small-pk{font-size:15px;padding-top:5px}
.pact-t td,.pact-t th{white-space:nowrap;font-variant-numeric:tabular-nums}
.pact-t tr.cur td{background:var(--primary-weak);font-weight:600}
.pact-t tr.fut td{color:var(--muted)}
@media (max-width:820px){
  header.top{backdrop-filter:none;background:var(--bg)}
  .g2,.g3,.dash-top{grid-template-columns:1fr}
  .hero-grid{grid-template-columns:1fr;gap:14px}
  .ampel{grid-template-columns:1fr}
  .row-ed2{grid-template-columns:minmax(0,1fr) 90px 34px;padding-bottom:8px;border-bottom:1px dashed var(--border)}
  .row-ed2 .nm{grid-column:1}.row-ed2 .am{grid-column:2}.row-ed2 .icon-btn{grid-column:3;grid-row:1}
  .row-ed2 select{grid-row:2}.row-ed2 select:first-of-type{grid-column:1}.row-ed2 select:last-of-type{grid-column:2/4}
  .pact-top{grid-template-columns:1fr 1fr}
  .cal-row{grid-template-columns:70px minmax(0,1fr) 60px;}
  .cal-s{grid-column:2/4}
  .form-grid{grid-template-columns:1fr 1fr}
  .form-grid .btn{grid-column:1/-1;justify-content:center}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--border);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));justify-content:space-around;gap:0}
  .sync span{display:none}
  nav.tabs button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;flex:1;min-width:0}
  nav.tabs button .tl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  nav.tabs button.on{box-shadow:none;background:var(--primary-weak);color:var(--primary)}
  .side{display:contents}
  .side-logo,.side-foot,.desk-only{display:none!important}
  .page-title{display:none}
  .month{margin-left:auto}
  .hero2{padding:20px;border-radius:22px}
  .hero2 .h-top{flex-direction:column-reverse;align-items:stretch}
  .hero2 .seg{margin-left:0;align-self:flex-start}
  .hero2 .h-big{font-size:42px}
  .hero2 .h-chart{height:160px}
  .kpis4{grid-template-columns:1fr 1fr!important;gap:12px}
  .kpi{padding:14px}
  .kpi-h{flex-wrap:wrap;font-size:13.5px;gap:8px}
  .kpi-ic{width:28px;height:28px;font-size:14px}
  .kpi-badge{margin-left:0}
  .hchip{padding:6px 11px}
  .hide-m{display:none!important}
  .txfull{grid-template-columns:38px 1fr auto;row-gap:4px}
  .txfull .catcell{grid-column:2/3}
  .txfull .delcell{grid-column:3/4;justify-self:end}
  .month span{min-width:84px;font-size:13px}
  .top-in{gap:4px}
  .top-in .icon-btn{width:30px}
  .logo .lt{display:none}
}
@media (min-width:821px){ body{padding-bottom:0} }
/* ===== Design 2: Seitenleiste, Kopfzeile, Kacheln ===== */
nav.tabs .ti{display:grid;place-items:center}
nav.tabs .ti svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.page-title{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.btn{border-radius:12px}
.btn.primary{background:var(--primary);border-color:var(--primary)}
.card{border-radius:var(--radius)}
.card h2{font-size:16.5px;font-weight:650}
@media (min-width:821px){
  .side{position:fixed;inset:0 auto 0 0;width:252px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 16px 16px;z-index:30;overflow-y:auto}
  .shell{margin-left:252px}
  .mob-only{display:none!important}
  .side-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;padding:0 8px 18px}
  .side-logo b{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--hero-2));color:#fff;font-size:17px}
  nav.tabs{flex-direction:column;padding:6px 0;gap:3px}
  nav.tabs button{width:100%;padding:11px 14px;border-radius:14px;font-size:15px;color:var(--text);font-weight:500;gap:13px;opacity:.85}
  nav.tabs button:hover{background:var(--bg);opacity:1}
  nav.tabs button.on{background:var(--hero-1);color:#fff;box-shadow:0 6px 16px rgba(11,31,75,.25);opacity:1}
  :root[data-theme="dark"] nav.tabs button.on{background:var(--primary-weak);color:var(--text)}
  .side{overflow-x:hidden}
  .side-foot{margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-top:16px;border-top:1px solid var(--border);min-width:0}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:13px 14px;font:600 15px var(--font);color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));cursor:pointer;box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 30%,transparent);transition:transform .12s,filter .12s}
  .cta:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .cta:active{transform:none}
  .cta:focus{outline:none}.cta:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
  .side-imp{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--border);background:transparent;border-radius:12px;padding:10px 12px;font:500 13.5px var(--font);color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-imp:hover{background:var(--bg);color:var(--text);border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
  .side-imp:focus{outline:none}.side-imp:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .me{display:flex;align-items:center;gap:10px;padding:8px 6px 2px;min-width:0}
  .av{width:38px;height:38px;border-radius:50%;background:var(--primary-weak);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  .me-t{min-width:0;flex:1;overflow:hidden}.me-t b,.me-t .small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me-t b{font-size:14px}
  .me .icon-btn{flex:none}
  header.top{border-bottom:0;background:color-mix(in srgb,var(--bg) 90%,transparent)}
  .top-in{height:72px}
  .wrap{max-width:1240px;padding-left:32px;padding-right:32px}
  main{padding-top:4px}
}
/* Hero «Verfügbar» */
.hero2{position:relative;overflow:hidden;border-radius:28px;padding:28px 32px;color:var(--hero-text);background:radial-gradient(120% 140% at 85% 0%,var(--hero-2) 0%,var(--hero-1) 55%,#060d22 100%);box-shadow:0 18px 40px rgba(11,31,75,.25)}
.hero2 .h-top{display:flex;align-items:flex-start;gap:12px}
.hero2 .h-lbl{color:var(--hero-muted);font-weight:500}
.hero2 .h-big{font-size:clamp(40px,7vw,72px);font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:10px 0 6px;font-variant-numeric:tabular-nums;color:#fff}
.hero2 .h-big small{font-size:.42em;font-weight:500;color:var(--hero-muted);margin-right:8px;letter-spacing:0}
.hero2 .h-big .dec{font-size:.5em;font-weight:500;color:var(--hero-muted)}
.hero2 .h-big.neg{color:#fecaca}
.hero2 .h-sub{color:var(--hero-text);opacity:.9}
.seg{margin-left:auto;display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;color:var(--hero-muted);font:500 14px var(--font);padding:7px 16px;border-radius:999px;cursor:pointer}
.seg button.on{background:#fff;color:#0b1324}
.hero2 .h-chart{position:relative;height:190px;margin:12px -6px 4px}
.hero2 .h-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hchip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--hero-muted);white-space:nowrap}
.hchip b{color:#fff;font-weight:600;margin-left:6px}
.hper{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:999px;padding:4px}
.hper button{border:0;background:transparent;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.hper button:hover{background:rgba(255,255,255,.12)}
.hper span{font-weight:600;color:#fff;min-width:120px;text-align:center;font-size:14px}
.hnote{margin-top:14px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.08);font-size:13.5px;color:var(--hero-text)}
/* Kennzahl-Kacheln */
.kpis4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0;cursor:default}
.kpi[data-act]{cursor:pointer}
.kpi-h{display:flex;align-items:center;gap:10px;font-weight:500;font-size:14.5px}
.kpi-ic{width:34px;height:34px;border-radius:50%;background:var(--primary-weak);color:var(--primary);display:grid;place-items:center;font-size:16px;flex:none}
.kpi-badge{margin-left:auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--green-bg);color:var(--green);white-space:nowrap}
.kpi-badge.bad{background:var(--red-bg);color:var(--red)}.kpi-badge.mid{background:var(--orange-bg);color:var(--orange)}
.kpi-v{font-size:clamp(24px,2.4vw,32px);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.kpi-v small{font-size:15px;color:var(--muted);font-weight:500;margin-left:2px}
.kpi-s{font-size:12.5px;color:var(--muted)}
.segbar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.segbar i{height:7px;border-radius:9px;background:var(--track)}
.segbar i.on{background:var(--green)}
/* Bevorstehend & Budget-Ringe */
.up-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--border)}
.up-row:first-of-type{border-top:0}
.up-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--primary-weak);color:var(--primary)}
.up-row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-row .s{font-size:12.5px;color:var(--muted)}
.up-row .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.ring-row:first-of-type{border-top:0}
.ring{position:relative;width:52px;height:52px}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.ring-row .t{font-weight:600}
.ring-row .s{font-size:12.5px}
.ring-row .a{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.ring-row .a b{display:block;color:var(--text);font-size:15px}
/* Einstellungen */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--border)}
.set-row:first-of-type{border-top:0}
.set-row .lbl{min-width:0;flex:1}.set-row>:last-child:not(.lbl){flex:none}.set-row .lbl b{display:block;font-weight:600;font-size:14.5px}.set-row .lbl span{font-size:12.5px;color:var(--muted)}
.set-row .inp{width:auto;min-width:120px;max-width:200px}
.sw{position:relative;width:46px;height:27px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--track);transition:.2s;cursor:pointer}
.sw i::after{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+i{background:var(--primary)}
.sw input:checked+i::after{transform:translateX(19px)}
.sw input:focus-visible+i{outline:2px solid var(--primary);outline-offset:2px}
.accents{display:flex;gap:8px}
.accents button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.accents button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--card) inset}
.cmp-row{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 78px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-size:14px;font-variant-numeric:tabular-nums}
.cmp-row>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-row:first-of-type{border-top:0}
.cmp-row .d{text-align:right;font-weight:600}
@media (max-width:820px){ .set-grid{grid-template-columns:1fr} .hper{margin-left:0} .cmp-row{grid-template-columns:minmax(0,1fr) 64px 64px 72px;font-size:13px} }
/* Dokumente */
.docs-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.docs-tree{position:sticky;top:84px;padding:12px}
.fold{display:flex;align-items:center;border-radius:12px}
.fold>button:first-child{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:12px;cursor:pointer;font:500 14px var(--font);color:var(--text);text-align:left}
.fold.sub>button:first-child{padding-left:30px;font-size:13.5px}
.fold:hover{background:var(--bg)}
.fold.on{background:var(--primary-weak)}.fold.on>button:first-child{color:var(--primary);font-weight:600}
.fold .fl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold .fc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fold .fz{width:28px;height:28px;font-size:13px;opacity:0;transition:opacity .15s}
.fold:hover .fz,.fold.on .fz{opacity:1}
.docs-pin{display:grid;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.docs-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.docs-head h2{flex:1;min-width:0}
.docs-head-btns{display:flex;gap:8px;flex-wrap:wrap}
.docs-fsel{display:none;margin-top:12px}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:10px;border-radius:12px;background:var(--primary-weak)}
.selbar b{margin-right:auto}
.doc-list{display:flex;flex-direction:column}
.doc-row{display:grid;grid-template-columns:28px minmax(0,2.4fr) minmax(0,1.2fr) minmax(0,1fr) 92px 72px 150px;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--border);border-radius:10px;font-size:14px}
.doc-row.sel{background:var(--primary-weak)}
.doc-row.doc-hd{border-top:0;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.doc-row label{display:grid;place-items:center}
.doc-name{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;cursor:pointer;font:600 14px var(--font);color:var(--text);text-align:left;min-width:0}
.doc-name:hover .dn{color:var(--primary);text-decoration:underline}
.doc-name .di{font-size:20px;flex:none}
.doc-name .dn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-type,.dm-per,.dm-up{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-size{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.doc-act{display:flex;justify-content:flex-end;gap:2px}
.doc-act .icon-btn{width:32px;height:32px;font-size:15px}
.dm-mob{display:none}
.pdf-page{display:block;width:100%;height:auto;margin:0 auto 12px;background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.doc-pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;max-height:70vh;overflow:auto}
.lock-card{max-width:360px;margin:40px auto;text-align:center;display:grid;gap:8px;justify-items:center}
.pin-in{text-align:center;font-size:22px;letter-spacing:.4em;max-width:220px}
.narrow-only{display:none!important}
@media (max-width:1180px){ .docs-wrap{grid-template-columns:1fr} .docs-tree{display:none} .docs-fsel{display:block} .narrow-only{display:inline-flex!important} }
.doc-list{container-type:inline-size}
@container (max-width:900px){ .doc-row{grid-template-columns:28px minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 72px 132px} .dm-up{display:none} .doc-row.doc-hd span:nth-child(5){display:none} }
@container (max-width:680px){
  .doc-row{grid-template-columns:24px minmax(0,1fr) auto;row-gap:2px;padding:10px 2px}
  .doc-row.doc-hd{display:none}
  .dm-type,.dm-per,.dm-up,.dm-size{display:none}
  .doc-act{grid-column:3;grid-row:1/3}
  .doc-act .icon-btn{width:30px}
  .dm-mob{display:block;grid-column:2;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@container (max-width:420px){ .doc-act [data-act="doc-move"],.doc-act [data-act="doc-ren"]{display:none} }
@media (max-width:820px){ nav.tabs button{font-size:9.5px} }
:root.compact .card{padding:14px}:root.compact .tx{padding:6px 0}:root.compact .kpi{padding:14px}
</style>
</head>

<script>
'use strict';
/* ================= Grundlagen ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf2 = new Intl.NumberFormat('de-CH', {minimumFractionDigits:2, maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('de-CH', {maximumFractionDigits:0});
const chf = n => 'CHF ' + nf2.format(Math.round((n || 0) * 100) / 100);
const chf0 = n => 'CHF ' + nf0.format(Math.round(n || 0));
const sum = arr => arr.reduce((a, b) => a + (+b || 0), 0);
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const pad = n => String(n).padStart(2, '0');

  return ' ' + searchNorm([txTitle(t), t.desc, tw, (t.ph && S.contacts[t.ph]) || '', t.note || '', t.cat, ...(t.splits || []).map(x => x.c), acctName(t.acct || ''),

/* ---- Budget-Vorschlag aus den letzten Monaten ---- */
const ceil5 = x => Math.ceil((x - 0.001) / 5) * 5;
function buildSuggestion() {
  const cur = curPeriod(), months = [];
  for (let i = 1; i <= 6 && months.length < 3; i++) { const m = addMonths(cur, -i); if (hasPeriodTx(m)) months.push(m); }
  const st = months.map(monthStats);
  const avg = c => st.length ? sum(st.map(s => Math.max(0, s.byCat[c] || 0))) / st.length : 0;
  // Einkommen: letzter Lohn, frühester Zahltag der letzten 3 Löhne
  const lohn = S.tx.filter(t => t.cat === 'Lohn' && t.amount > 0).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
  const income = [];
  if (lohn.length && !S.income.some(i => i.amount)) income.push({name: 'Lohn', amount: lohn[0].amount, day: Math.min(...lohn.map(t => +t.date.slice(8, 10))), freq: 'm', on: true});
  // Fixkosten: erkannte Abos & Co.
  const avgSide = st.length ? sum(st.map(s => s.txs.filter(t => t.cat === 'Nebeneinnahmen').reduce((a, t) => a + t.amount, 0))) / st.length : 0;
  if (avgSide >= 20 && !S.income.some(i => /neben|twint/i.test(i.name || ''))) income.push({name: 'Nebeneinnahmen (Ø, z. B. TWINT)', amount: Math.floor(avgSide / 10) * 10, day: 1, freq: 'm', on: false});
  const have = S.fixed.map(f => normalize(f.name));
  const latest = S.tx.map(t => t.date).sort().pop() || isoLocal(new Date());
  const cutoff = isoLocal(new Date(new Date(latest).getTime() - 45 * 86400000));
  const lastAmt = key => { const t = S.tx.filter(t => t.amount < 0 && merchantKey(t.desc) === key).sort((a, b) => b.date.localeCompare(a.date))[0]; return t ? -t.amount : 0; };
  const fixed = subscriptions().filter(s => ['Abos', 'Handy', 'Versicherung', 'Kostgeld'].includes(s.cat) && s.months >= 2 && s.last >= cutoff)
    .map(s => ({name: s.name.replace(/\s*\(.*\)\s*$/, '').replace(/\s+/g, ' ').slice(0, 30), amount: Math.round((lastAmt(s.key) || s.amount) * 100) / 100, day: +s.last.slice(8, 10), freq: 'm', on: true}))
    .filter(f => !have.some(h => h && (normalize(f.name).includes(h) || h.includes(normalize(f.name).split(' ')[0]))));
  const incTotal = sum(S.income.filter(i => itemApplies(i, cur)).map(i => i.amount)) + sum(income.filter(i => i.on).map(i => i.amount));
  const fixTotal = sum(S.fixed.filter(i => itemApplies(i, cur)).map(i => i.amount)) + sum(fixed.map(f => f.amount));
  const save = plan(cur).goalsMonthly;
  const available = incTotal - fixTotal - save;
  const ESSENTIAL = ['Essen', 'Transport'];
  const cats = VAR_CATS.map(c => ({c, avg: avg(c), val: ceil5(avg(c))}));
  const avgTotal = sum(cats.map(x => x.avg));
  let total = sum(cats.map(x => x.val));
  if (available > 0 && total > available) {
    const disc = cats.filter(x => !ESSENTIAL.includes(x.c)); const discTotal = sum(disc.map(x => x.val));
    const f = Math.max(0.4, 1 - (total - available) / Math.max(1, discTotal));
    disc.forEach(x => { x.val = Math.max(0, Math.floor(x.val * f / 5) * 5); });
    total = sum(cats.map(x => x.val));
    if (total > available) { const f2 = Math.max(0.7, available / total); cats.forEach(x => { x.val = Math.floor(x.val * f2 / 5) * 5; }); }
  }
  return {months, income, fixed, cats, save, available, incTotal: incTotal + sum(income.filter(i => !i.on).map(i => i.amount)), fixTotal, avgTotal};
}

function compareCard() {

    .map(c => ({c, x: a.byCat[c] || 0, y: b.byCat[c] || 0})).sort((p, q) => Math.abs(q.x - q.y) - Math.abs(p.x - p.y));
  const lA = isAuto() ? 'jetzt' : monthLabel(UI.month, true), lB = isAuto() ? 'vorher' : monthLabel(addMonths(UI.month, -1), true);

/* ---- Auswertung: Kennzahlen & Jahresübersicht ---- */
function yearOverview() {
  const cur = curPeriod(); const months = []; for (let i = 11; i >= 0; i--) { const m = addMonths(cur, -i); if (hasPeriodTx(m)) months.push(m); }
  if (!months.length) return '';
  const st = months.map(monthStats);
  const tot = k => sum(st.map(s => s[k]));

function payForecast() {
  const pay = (S.accounts || []).find(a => a.id === mainAcctId()); if (!pay) return null;
  const cp = curPeriod(); const [ps, pe] = periodRange(cp); const today = isoLocal(new Date());
  if (today < ps || today >= pe) return null;
  const st = monthStats(cp); const daysGone = Math.max(1, Math.round((new Date(today) - new Date(ps)) / 86400000) + 1);
  const daysLeft = Math.max(0, Math.round((new Date(pe) - new Date(today)) / 86400000) - 1);
  const perDay = st.vari / daysGone;
  const openFix = calendar(cp).filter(c => !c.tx && c.date > today && c.date < pe && c.kind !== 'in').reduce((a, c) => a + Math.abs(c.amount), 0);
  const now = acctBalance(pay);
  return {now, end: now - perDay * daysLeft - openFix, perDay, daysLeft, openFix, name: pay.name};
}

function learnCategory(t, cat) {

}

  else { root.dataset.theme = S.settings.theme; themeSetByApp = true; }
  const t = root.dataset.theme || (mq.matches ? 'dark' : 'light');

/* ================= Sync über das Claude-Konto ================= */
// Daten liegen im privaten Bereich data/users/<deine-id>/ – nur du siehst sie.
// Ein Dokument «meta» (Budget, Ziele, Regeln) + ein Dokument pro Monat mit den Transaktionen.
// Sicherheitsregeln:
//  • Hochgeladen wird NUR, was auf diesem Gerät wirklich geändert wurde (dirty) – nie einfach «alles, was anders aussieht».
//  • «meta» wird mit dem Konto-Stand zusammengeführt: Felder, die diese Version nicht kennt, bleiben erhalten.
//  • Ist im Konto eine neuere App-Version am Werk, schreibt diese Version nichts und bittet ums Neuladen.

let _docDb = null;
function docDb() {

    r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('meta', {keyPath: 'id'}); db.createObjectStore('blobs'); db.createObjectStore('kv'); };
    r.onsuccess = () => { _docDb = r.result; res(_docDb); }; r.onerror = () => rej(r.error);

}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

async function extractText(file) {
  const ext = extOf(file.name);
  try {
    if (ext === 'pdf' && window.pdfjsLib) {
      const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise; let t = '';
      for (let i = 1; i <= Math.min(2, pdf.numPages); i++) { const tc = await (await pdf.getPage(i)).getTextContent(); t += tc.items.map(x => x.str).join(' ') + ' '; }
      return t;
    }
    if (['txt', 'csv'].includes(ext)) return (await file.text()).slice(0, 20000);
  } catch (e) { console.error(e); }
  return '';
}
function suggestType(text, fname) {
  const s = normalize(text + ' ' + fname);
  if (/lohnausweis|certificat de salaire/.test(s)) return 'Lohnausweis';
  if (/lohnabrechnung|lohnabr|salärabrechnung|salaerabrechnung|gehaltsabrechnung|lohnzettel|lohnblatt/.test(s)) return 'Lohnabrechnung';
  if (/steuererklärung|steuererklaerung|steuerformular/.test(s)) return 'Steuererklärung';
  if (/steuerrechnung|staats- und gemeindesteuer|direkte bundessteuer|provisorische rechnung/.test(s)) return 'Steuerrechnung';
  if (/police|versicherungsnachweis|versicherungsausweis|prämienrechnung|praemienrechnung|versicherungsvertrag/.test(s)) return 'Versicherungspolice';
  if (/kontoauszug|saldovortrag/.test(s)) return 'Kontoauszug';
  if (/vertrag|mietvertrag|vereinbarung|lehrvertrag/.test(s)) return 'Vertrag';
  if (/quittung|kassenbon|kaufbeleg|kassenzettel/.test(s)) return 'Quittung';
  if (/rechnung|invoice|zahlbar bis|qr-rechnung|einzahlungsschein|zahlungsfrist/.test(s)) return 'Rechnung';
  return 'Anderes';
}
function detectDocDates(text) {
  const s = normalize(text); const full = ['januar', 'februar', 'märz', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'dezember'];
  const mm = {}, years = {}; let m;
  const re = /(januar|februar|märz|maerz|april|mai|juni|juli|august|september|oktober|november|dezember)\s+(20\d\d)/g;
  while ((m = re.exec(s))) { const idx = m[1] === 'maerz' ? 2 : full.indexOf(m[1]); const k = m[2] + '-' + pad(idx + 1); mm[k] = (mm[k] || 0) + 2; }
  const dates = [...s.matchAll(/\b(\d{1,2})\.(\d{1,2})\.(20\d\d)\b/g)].filter(x => +x[2] >= 1 && +x[2] <= 12 && +x[1] <= 31).map(x => x[3] + '-' + pad(+x[2]) + '-' + pad(+x[1]));
  dates.forEach(d => { mm[d.slice(0, 7)] = (mm[d.slice(0, 7)] || 0) + 1; });
  [...s.matchAll(/\b(20\d\d)\b/g)].forEach(x => { if (+x[1] >= 2000 && +x[1] <= 2100) years[x[1]] = (years[x[1]] || 0) + 1; });
  const top = o => (Object.entries(o).sort((a, b) => b[1] - a[1])[0] || [])[0];

}

/* ---- Vorschau ---- */
async function openDocPreview(id) {
  const d = DOCS.list.find(x => x.id === id); if (!d) return;
  openModal(`<div class="modal" style="width:min(1000px,100%)"><div class="modal-h"><h3 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${docIcon(d)} ${esc(fullName(d))}</h3><button class="btn small" data-act="doc-dl" data-id="${d.id}" style="margin-left:auto">⬇ Herunterladen</button><button class="icon-btn" data-act="close" style="margin-left:4px">✕</button></div>
    <div class="modal-b" id="doc-prev-body" style="background:var(--bg)"><p class="muted">Vorschau wird geladen …</p></div></div>`);
  const body = $('#doc-prev-body'); const blob = await docBlob(id);
  if (!blob) { body.innerHTML = '<p class="neg">Die Datei wurde auf diesem Gerät nicht gefunden.</p>'; return; }
  try {
    if (d.ext === 'pdf' && window.pdfjsLib) {
      body.innerHTML = '';
      const pdf = await pdfjsLib.getDocument({data: await blob.arrayBuffer()}).promise; const n = Math.min(pdf.numPages, 30);
      for (let i = 1; i <= n; i++) {
        if (!document.body.contains(body)) return;
        const page = await pdf.getPage(i); const vp0 = page.getViewport({scale: 1});
        const w = Math.max(280, body.clientWidth - 8); const scale = Math.min(2.2, w / vp0.width) * (window.devicePixelRatio || 1);
        const vp = page.getViewport({scale}); const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.className = 'pdf-page';
        body.appendChild(c); await page.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
      }
      if (pdf.numPages > n) body.insertAdjacentHTML('beforeend', `<p class="muted small">… ${pdf.numPages - n} weitere Seiten – herunterladen, um alles zu sehen.</p>`);
    } else if (/^(png|jpe?g|webp|gif)$/.test(d.ext)) {
      const url = URL.createObjectURL(blob); body.innerHTML = `<img src="${url}" alt="${esc(fullName(d))}" style="max-width:100%;display:block;margin:auto;border-radius:10px">`;
    } else if (['csv', 'txt'].includes(d.ext)) {
      const t = await blob.text(); body.innerHTML = `<pre class="doc-pre">${esc(t.split(/\r?\n/).slice(0, 300).join('\n'))}</pre>`;
    } else body.innerHTML = '<p class="muted">Für diesen Dateityp gibt es keine Vorschau. Lade die Datei herunter, um sie zu öffnen.</p>';
  } catch (e) { console.error(e); body.innerHTML = '<p class="neg">Vorschau nicht möglich: ' + esc(e.message || e) + '</p>'; }
}
/* ---- Download & ZIP ---- */
async function downloadDoc(id) { const d = DOCS.list.find(x => x.id === id); const b = d && await docBlob(id); if (!b) return toast('Datei nicht gefunden'); download(fullName(d), b, d.mime || 'application/octet-stream'); }
async function zipDocs(docs, zipName) {
  if (!docs.length) return toast('Keine Dokumente ausgewählt');
  if (!window.JSZip) return toast('⚠️ ZIP-Funktion nicht geladen (Internetverbindung prüfen)');
  toast(`ZIP wird erstellt (${docs.length} Dateien) …`, 3000);
  const zip = new JSZip(); const used = new Set();
  for (const d of docs) { const b = await docBlob(d.id); if (!b) continue; let p = docPath(d) + '/' + fullName(d), i = 2; while (used.has(p)) p = docPath(d) + '/' + d.name + '_' + (i++) + (d.ext ? '.' + d.ext : ''); used.add(p); zip.file(p, b); }
  const out = await zip.generateAsync({type: 'blob', compression: 'DEFLATE'});
  download(cleanName(zipName) + '.zip', out, 'application/zip');
}
/* ---- PIN ---- */
async function pinHash(pin, salt) { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }

async function deleteDocsFlow(ids) {
  const docs = ids.map(id => DOCS.list.find(d => d.id === id)).filter(Boolean); if (!docs.length) return;
  const txs = [...new Set(docs.flatMap(linkedTx))];
  const label = docs.length === 1 ? `«${fullName(docs[0])}»` : `${docs.length} Dokumente`;
  const v = await ask(`<div class="modal sm"><div class="modal-h"><h3>Löschen?</h3><button class="icon-btn" data-act="close">✕</button></div>
    <div class="modal-b"><p style="margin-top:0">${esc(label)} wirklich löschen? Das kann nicht rückgängig gemacht werden.</p>
      ${txs.length ? `<div class="note orange">Zu ${docs.length === 1 ? 'diesem Kontoauszug' : 'diesen Kontoauszügen'} gehören <b>${txs.length} Buchungen</b> in deinem Budget. Sollen diese ebenfalls entfernt werden?</div>` : ''}</div>
    <div class="modal-f"><button class="btn" data-act="ask" data-v="cancel">Abbrechen</button>${txs.length ? `<button class="btn" data-act="ask" data-v="doc">Nur Dokument löschen</button><button class="btn danger" data-act="ask" data-v="all">Dokument + ${txs.length} Buchungen löschen</button>` : `<button class="btn danger" data-act="ask" data-v="doc">Löschen</button>`}</div></div>`);
  if (v !== 'doc' && v !== 'all') return;
  for (const d of docs) await removeDoc(d.id);
  if (v === 'all') { const del = new Set(txs.map(t => t.id)); S.tx = S.tx.filter(t => !del.has(t.id)); save(); }
  else { const gone = new Set(docs.map(d => d.id)); let ch = false; for (const t of S.tx) if (t.doc && gone.has(t.doc)) { delete t.doc; ch = true; } if (ch) save(); }
  render(); toast(v === 'all' ? `Gelöscht: ${label} und ${txs.length} Buchungen` : `Gelöscht: ${label}`);
}
